<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chat</title>
<style>
  :root {
    --bg: #0c0f0d;
    --fg: #c8d3c5;
    --dim: #5f6d5c;
    --accent: #e6c15a;
    --err: #e07a6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
  body {
    display: flex; flex-direction: column;
    font: 15px/1.5 "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  }
  #bar { padding: 6px 12px; color: var(--dim); border-bottom: 1px solid #1c231e; display: flex; justify-content: space-between; }
  #status.on { color: #7fc48a; }
  #log { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .line { white-space: pre-wrap; word-break: break-word; }
  .ts { color: var(--dim); }
  .sys { color: var(--dim); }
  .err { color: var(--err); }
  #row { display: flex; gap: 8px; padding: 8px 12px 12px; border-top: 1px solid #1c231e; }
  #prompt { color: var(--accent); white-space: nowrap; }
  #in {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--fg); font: inherit; caret-color: var(--accent);
  }
  #in:focus-visible { outline: 0; }
</style>
</head>
<body>
<div id="bar"><span>chat — last 100 messages</span><span id="status">connecting…</span></div>
<div id="log" aria-live="polite"></div>
<div id="row"><span id="prompt"></span><input id="in" maxlength="500" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, push, query, limitToLast, orderByKey, endBefore,
  onChildAdded, onChildRemoved, onValue, get, remove, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ====== 1. PASTE YOUR FIREBASE CONFIG HERE ====== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};
/* ================================================= */

const KEEP = 100;
const logEl = document.getElementById("log");
const inEl = document.getElementById("in");
const promptEl = document.getElementById("prompt");
const statusEl = document.getElementById("status");

function sys(text, cls = "sys") {
  const d = document.createElement("div");
  d.className = "line " + cls;
  d.textContent = text;
  addLine(d);
}
function addLine(el) {
  const stick = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 60;
  logEl.appendChild(el);
  if (stick) logEl.scrollTop = logEl.scrollHeight;
}

/* nickname */
let nick = "";
try { nick = localStorage.getItem("chat-nick") || ""; } catch (e) {}
if (!nick) nick = "guest" + Math.floor(100 + Math.random() * 900);
function setNick(n) {
  nick = n.replace(/[^\w\-.]/g, "").slice(0, 20) || nick;
  try { localStorage.setItem("chat-nick", nick); } catch (e) {}
  promptEl.textContent = nick + " >";
}
setNick(nick);

/* per-name color */
function colorFor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 55% 65%)`;
}

if (firebaseConfig.apiKey === "YOUR_API_KEY") {
  statusEl.textContent = "not configured";
  sys("Paste your Firebase config into index.html first.", "err");
  throw new Error("Firebase config missing");
}

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messages = ref(db, "messages");
const windowQuery = query(messages, limitToLast(KEEP));
const nodes = new Map();

onValue(ref(db, ".info/connected"), snap => {
  const on = snap.val() === true;
  statusEl.textContent = on ? "online" : "offline";
  statusEl.className = on ? "on" : "";
});

onChildAdded(windowQuery, snap => {
  const m = snap.val();
  if (!m || typeof m.text !== "string") return;
  const d = document.createElement("div");
  d.className = "line";
  const t = new Date(m.ts || Date.now());
  const ts = document.createElement("span");
  ts.className = "ts";
  ts.textContent = t.toTimeString().slice(0, 5) + " ";
  const who = document.createElement("span");
  who.style.color = colorFor(String(m.name));
  who.textContent = "<" + m.name + "> ";
  const body = document.createElement("span");
  body.textContent = m.text;
  d.append(ts, who, body);
  nodes.set(snap.key, d);
  addLine(d);
});

onChildRemoved(windowQuery, snap => {
  const el = nodes.get(snap.key);
  if (el) { el.remove(); nodes.delete(snap.key); }
});

/* delete everything older than the newest KEEP messages */
async function trim() {
  try {
    const newest = await get(query(messages, orderByKey(), limitToLast(KEEP)));
    let first = null;
    newest.forEach(s => { if (first === null) first = s.key; });
    if (first === null) return;
    const old = await get(query(messages, orderByKey(), endBefore(first)));
    old.forEach(s => { remove(s.ref); });
  } catch (e) { /* cleanup is best-effort */ }
}

async function send(text) {
  try {
    await push(messages, { name: nick, text, ts: serverTimestamp() });
    trim();
  } catch (e) {
    sys("send failed: " + e.message, "err");
  }
}

function command(line) {
  const [cmd, ...rest] = line.slice(1).split(" ");
  const arg = rest.join(" ").trim();
  if (cmd === "nick") {
    if (!arg) return sys("usage: /nick <name>");
    setNick(arg);
    sys("you are now " + nick);
  } else if (cmd === "clear") {
    logEl.textContent = "";
    nodes.clear();
  } else if (cmd === "help") {
    sys("/nick <name>  change your name\n/clear        clear your screen (others unaffected)\n/help         show this");
  } else {
    sys("unknown command: /" + cmd + " (try /help)", "err");
  }
}

inEl.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const line = inEl.value.trim();
  inEl.value = "";
  if (!line) return;
  if (line.startsWith("/")) command(line); else send(line);
});

document.addEventListener("click", () => {
  if (!getSelection().toString()) inEl.focus();
});

sys("type a message and press Enter. /help for commands.");
</script>
</body>
</html>
